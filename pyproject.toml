[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "review-backend"
version = "1.0.0"
description = "Persistent, independent code reviews using local Ollama inference"
requires-python = ">=3.12,<3.13"
dependencies = [
  "thrift==0.25.0",
  "local-llm-contract==1.0.0",
  "fastapi>=0.115,<1",
  "uvicorn>=0.35,<1",
  "pydantic-settings>=2.10,<3",
  "psycopg[binary]==3.2.13",
  "confluent-kafka==2.12.0",
  "argon2-cffi>=25.1,<26",
  "prometheus-client>=0.22,<1",
]

[project.scripts]
review-api = "app.entrypoints:api"
outbox-relay = "app.relay.main:main"
review-worker = "app.worker.main:main"
review-recover = "app.recovery:main"
review-migrate = "app.persistence.migrate:main"

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8.4,<10", "ruff>=0.12,<1", "pyyaml>=6,<7"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100


[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# Keep test-helper imports classified consistently from the repo root and backend/.
known-first-party = ["app", "backend"]

[tool.setuptools.package-data]
"app.persistence" = ["migrations/*.sql"]
"app.messaging" = ["contracts/*.json"]
